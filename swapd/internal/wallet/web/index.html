<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="wallet-token" content="">
<title>SeshSwap</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' width='64' height='64'%3E%3Crect width='64' height='64' rx='15' fill='%230E1620'/%3E%3Cg fill='none' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M32 32h7a7 7 0 0 1 0 14H18M24 40l-6 6 6 6' stroke='%23A3B1FF'/%3E%3Cpath d='M46 18H25a7 7 0 0 0 0 14h7M40 12l6 6-6 6' stroke='%2346D3B0'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    /* SeshSwap palette (branding/README.md): ink neutrals, jade accent, periwinkle second. */
    color-scheme: dark;
    --bg: #0B0F14;
    --bg2: #0F151C;
    --card: #141B23;
    --card2: #19222C;
    --line: #26313D;
    --text: #E6EDF3;
    --muted: #8A98A8;
    --accent: #46D3B0;
    --accent-ink: #05261E;
    --accent-dim: #164A3E;
    --accent2: #A3B1FF;
    --warn: #F0C14B;
    --warn-ink: #2A1E00;
    --warn-bg: #2A2410;
    --warn-line: #5A4A18;
    --danger: #F07178;
    --ok: #46D3B0;
    --shadow: 0 12px 40px rgba(0,0,0,.35);
    --radius: 16px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #F5F7F9;
      --bg2: #ECF0F3;
      --card: #FFFFFF;
      --card2: #F4F7F9;
      --line: #D9E0E6;
      --text: #0E1620;
      --muted: #566474;
      --accent: #0B8A6F;
      --accent-ink: #FFFFFF;
      --accent-dim: #BFE9DD;
      --accent2: #5A6BE0;
      --warn: #8A5A00;
      --warn-ink: #FFFFFF;
      --warn-bg: #FFF6DB;
      --warn-line: #E9D28A;
      --danger: #C93C45;
      --ok: #0B8A6F;
      --shadow: 0 6px 24px rgba(14,22,32,.08);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.5 "IBM Plex Sans", "Source Sans 3", ui-sans-serif, system-ui, sans-serif; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); }
  #app { min-height: 100%; display: flex; }
  .sidebar { width: 220px; background: var(--bg2); border-right: 1px solid var(--line);
    padding: 24px 16px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .brand { font-weight: 650; letter-spacing: -.02em; font-size: 18px; margin: 0 8px 18px;
    display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 28px; height: 28px; display: block; flex-shrink: 0; border-radius: 7px; box-shadow: 0 0 0 1px var(--line); }
  .brand .tag { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--accent2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; }
  .navbtn { background: none; border: 0; color: var(--muted); text-align: left; padding: 10px 12px;
    border-radius: 10px; width: 100%; }
  .navbtn:hover, .navbtn.on { background: var(--card); color: var(--text); }
  .navbtn.on { color: var(--accent); }
  .side-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 8px; }
  .conn { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 10px; line-height: 1.35; }
  .conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; margin-top: 4px; }
  .conn.connecting i { background: var(--warn); }
  .conn.connected i { background: var(--accent); }
  .conn.error i { background: var(--danger); }
  .conn.error { color: var(--danger); }
  .conn small { display: block; color: var(--muted); margin-top: 2px; }
  .main { flex: 1; padding: 36px 44px; max-width: 880px; }
  .banner { background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn);
    padding: 10px 14px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; }
  .banner a, .banner button.link { color: var(--warn); }
  .h1 { font-size: 28px; font-weight: 650; letter-spacing: -.03em; margin: 0 0 8px; }
  .lead { color: var(--muted); margin: 0 0 28px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 24px; box-shadow: var(--shadow); }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .bal { flex: 1; min-width: 180px; background: var(--card2); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px 20px; }
  .bal .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .bal .v { font-size: 26px; font-weight: 650; letter-spacing: -.03em; margin: 4px 0; }
  .card .a { color: var(--muted); font-size: 13px; }
  .bal .a { color: var(--muted); font-size: 12px; word-break: break-all; }
  .btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px;
    padding: 11px 18px; font-weight: 650; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn:hover:not(:disabled) { filter: brightness(1.05); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .btn.warn { background: var(--warn); color: var(--warn-ink); }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn.big { padding: 14px 22px; font-size: 17px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  input[type=text], input[type=password], input[type=number], textarea {
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 13px; width: 100%; }
  input:focus, textarea:focus { outline: 2px solid var(--accent-dim); border-color: var(--accent); }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
  .err { color: var(--danger); font-size: 14px; margin-top: 8px; }
  .ok { color: var(--ok); }
  .words { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0; }
  .words div { background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font-variant-numeric: tabular-nums; }
  .words b { color: var(--muted); font-weight: 500; margin-right: 6px; font-size: 12px; }
  .warnbox { background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn);
    padding: 12px 14px; border-radius: 10px; font-size: 14px; }
  .timeline { list-style: none; padding: 0; margin: 16px 0; }
  .timeline li { padding: 10px 0 10px 22px; border-left: 2px solid var(--line); position: relative; color: var(--muted); }
  .timeline li::before { content: ""; width: 10px; height: 10px; border-radius: 50%;
    background: var(--line); position: absolute; left: -6px; top: 16px; }
  .timeline li.on { color: var(--text); }
  .timeline li.on::before { background: var(--accent); }
  .status-lg { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
  .refund { background: var(--card2); border-radius: 10px; padding: 12px 14px; color: var(--muted); font-size: 14px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
    padding: 8px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 12px 6px; border-bottom: 1px solid var(--line); }
  .center { max-width: 560px; margin: 8vh auto; }
  .hide { display: none !important; }
  .copy { background: none; border: 0; color: var(--accent); font-size: 12px; padding: 0 6px; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: var(--card2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted); }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  table.q { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.q td, table.q th { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  table.q th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  tr.best td { color: var(--accent); }
  td.why { color: var(--muted); }
  .mono { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 13px; }
  @media (max-width: 720px) {
    .sidebar { display: none; }
    .main { padding: 20px; }
    .words { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = (s, el=document) => el.querySelector(s);
const TOKEN = (document.querySelector('meta[name="wallet-token"]')||{}).content || "";
const state = { status: null, balances: null, screen: "boot", words: null, checks: null, quote: null, swap: null, swaps: [], settings: null, err: "", draft: {} };

async function api(path, opts={}) {
  const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", "X-Wallet-Token": TOKEN, ...(opts.headers||{}) } });
  const t = await r.text();
  let j = {};
  try { j = t ? JSON.parse(t) : {}; } catch(e) { j = { error: t }; }
  if (!r.ok) { const e = new Error(j.error || r.statusText); e.body = j; throw e; }
  return j;
}
function esc(s){ return String(s??"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function short(a){ a=String(a||""); return a.length>16 ? a.slice(0,8)+"…"+a.slice(-6) : a; }
function copy(t){ navigator.clipboard.writeText(t); }

const MARK = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#0E1620"/><g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M32 32h7a7 7 0 0 1 0 14H18M24 40l-6 6 6 6" stroke="#A3B1FF"/><path d="M46 18H25a7 7 0 0 0 0 14h7M40 12l6 6-6 6" stroke="#46D3B0"/></g></svg>`;

function connLine(st) {
  const c = (st && st.connection) || {};
  if (!c.label) return "";
  const cls = c.state === "connected" ? "connected" : c.state === "connecting" ? "connecting" : c.state === "error" ? "error" : "";
  const extra = c.state === "connected" && c.startupMs ? `<small>ready in ${(c.startupMs/1000).toFixed(1)} s</small>` : "";
  const detail = c.detail ? `<small data-testid="conn-detail">${esc(c.detail)}</small>` : "";
  return `<div class="conn ${cls}"><i></i><div>${esc(c.label)}${extra}${detail}</div></div>`;
}

function shell(main, {nav}={}) {
  const st = state.status || {};
  const unlocked = st.state === "unlocked";
  const navItem = (id, label) => `<button class="navbtn ${nav===id?"on":""}" data-go="${id}">${label}</button>`;
  return `
  ${unlocked ? `<aside class="sidebar">
    <div class="brand">${MARK} SeshSwap</div>
    ${navItem("home","Balances")}
    ${navItem("swap","Swap")}
    ${navItem("send","Send")}
    ${navItem("search","Directory")}
    ${st.exitsEnabled ? navItem("exits","Exits") : ""}
    ${navItem("history","History")}
    ${navItem("settings","Settings")}
    <div class="side-foot">
      <div id="conn" data-testid="conn">${connLine(st)}</div>
      ${esc(st.network||"")}<br>
      Test only. Not audited.
      <div class="actions"><button class="btn ghost" data-act="lock">Sign out</button></div>
    </div>
  </aside>` : ""}
  <main class="main">
    ${st.pending && nav!=="confirm-satchel" ? `<div class="banner" data-testid="pending-banner">A Satchel-style page asked for a trade.
      <button class="btn ghost" data-go="confirm-satchel" style="margin-left:8px">Review it</button></div>` : ""}
    ${st.openId && nav!=="progress" ? `<div class="banner" data-testid="open-banner">A trade is still in progress.
      <button class="btn ghost" data-go="progress" data-id="${esc(st.openId)}" style="margin-left:8px">View it</button></div>` : ""}
    ${main}
  </main>`;
}

function welcome() {
  return `<div class="center">
    <div class="brand" style="margin-bottom:24px">${MARK} SeshSwap <span class="tag">testnet</span></div>
    <h1 class="h1">Swap ETH for Monero, without giving anyone your money.</h1>
    <p class="lead">A non-custodial wallet for ETH, USDC and XMR. If a trade goes wrong, your ETH is returned automatically. This build is for testnets only, and it is not audited.</p>
    <div class="actions">
      <button class="btn big" data-go="create" data-testid="create">Create a new wallet</button>
      <button class="btn ghost big" data-go="restore" data-testid="restore">I have a 24-word backup</button>
    </div>
  </div>`;
}

function unlock() {
  return `<div class="center"><div class="card stack">
    <h1 class="h1">Unlock your wallet</h1>
    <p class="lead">Enter the password you chose when you created this wallet. This is not your 24-word backup.</p>
    <div><label>Password</label><input type="password" id="pw" data-testid="password" autofocus></div>
    ${err()}
    <div class="actions"><button class="btn big" data-act="unlock" data-testid="unlock">Unlock</button></div>
  </div></div>`;
}

function createShow() {
  const words = state.words || [];
  return `<div class="center"><div class="card">
    <h1 class="h1">Write these words down</h1>
    <p class="lead">This is the only backup. Anyone with these words can spend your ETH, USDC and XMR. We cannot recover them for you. They are not saved on this computer in the clear.</p>
    <div class="words" data-testid="seed-grid">${words.map((w,i)=>`<div><b>${i+1}</b>${esc(w)}</div>`).join("")}</div>
    <div class="warnbox">Store them on paper, offline. Do not take a screenshot or email them.</div>
    <div class="check" style="margin-top:16px"><input type="checkbox" id="wrote" data-testid="wrote"> <label for="wrote" style="margin:0">I have written these words down, in order.</label></div>
    ${err()}
    <div class="actions">
      <button class="btn ghost" data-go="welcome">Back</button>
      <button class="btn" id="cont" data-go="confirm" disabled data-testid="continue">Continue</button>
    </div>
  </div></div>`;
}

function confirmWords() {
  const cs = state.checks || [];
  return `<div class="center"><div class="card">
    <h1 class="h1">Check your backup</h1>
    <p class="lead">Type the words we ask for, to make sure you wrote them down correctly.</p>
    <div class="stack">${cs.map(n=>`<div><label>Word ${n}</label><input type="text" data-word="${n}" autocapitalize="off" autocomplete="off" data-testid="word-${n}"></div>`).join("")}</div>
    ${err()}
    <div class="actions">
      <button class="btn ghost" data-go="create-show">Back to the words</button>
      <button class="btn" data-act="to-password" data-testid="words-ok">Continue</button>
    </div>
  </div></div>`;
}

function setPassword(mode) {
  const title = mode === "restore" ? "Set a password, and restore" : "Set a password";
  return `<div class="center"><div class="card stack">
    <h1 class="h1">${title}</h1>
    <p class="lead">This password encrypts the wallet on this computer. It cannot replace a lost 24-word backup. Use at least 8 characters.</p>
    ${mode==="restore" ? `<div><label>Your 24-word backup</label><textarea id="mn" rows="4" data-testid="mnemonic" placeholder="word1 word2 … word24"></textarea></div>` : ""}
    <div><label>Password</label><input type="password" id="pw1" data-testid="pw1"></div>
    <div><label>Type it again</label><input type="password" id="pw2" data-testid="pw2"></div>
    ${err()}
    <div class="actions">
      <button class="btn ghost" data-go="${mode==="restore"?"welcome":"confirm"}">Back</button>
      <button class="btn" data-act="${mode==="restore"?"do-restore":"do-create"}" data-testid="save" ${state.saving?"disabled":""}>${state.saving ? "Opening your wallet…" : "Save and open"}</button>
    </div>
    ${state.saving ? `<div class="a" data-testid="saving">Setting up your ETH and Monero wallets. The first time takes up to a minute.</div>` : ""}
  </div></div>`;
}

function home() {
  const b = state.balances || {};
  const st = state.status || {};
  const cell = (k, v, addr, err, extra) => `<div class="bal"><div class="k">${k}</div>
    <div class="v" data-testid="bal-${k}">${esc(v ?? (state.balances ? "—" : "…"))}</div>
    ${extra || ""}
    ${err ? `<div class="${k==="USDC"?"a":"err"}">${esc(err)}</div>` : ""}
    ${addr ? `<div class="a mono">${esc(addr)} <button class="copy" data-copy="${esc(addr)}">Copy</button></div>` : ""}</div>`;
  const xmrLock = b.xmrLocked ? `<div class="a" data-testid="xmr-locked">${esc(b.xmrLocked)} XMR is still locked. Spendable in about ${esc(b.xmrUnlockMins)} min.</div>` : "";
  return shell(`
    <h1 class="h1">Balances</h1>
    <p class="lead">${esc(st.network||"")} · Test only. Not audited.</p>
    <div class="row">
      ${cell("ETH", b.eth, b.ethAddress, b.ethError)}
      ${cell("USDC", b.usdc ?? (state.balances ? "0" : undefined), "", b.usdcError || b.usdcNote, `<div class="a">Uses your ETH address.</div>`)}
      ${cell("XMR", b.xmr, b.xmrAddress, b.xmrError, xmrLock)}
    </div>
    <div class="actions"><button class="btn big" data-go="swap" data-testid="go-swap">Swap</button>
      <button class="btn ghost big" data-go="send" data-testid="go-send">Send</button>
      ${st.faucet ? `<button class="btn ghost" data-act="faucet-claim" data-testid="faucet-claim" ${state.faucetBusy||faucetEmpty()?"disabled":""}>${state.faucetBusy ? "Getting test coins…" : "Get test coins"}</button>` : ""}</div>
    ${st.faucet ? faucetBox() : ""}
  `, {nav:"home"});
}

// ---- Send ----
const SEND_COINS = ["XMR","ETH","USDC"];
function sendCoins() {
  const b = state.balances || {};
  return SEND_COINS.filter(c => c !== "USDC" || b.usdcAddress || b.demo);
}
function sendBalance(c) {
  const b = state.balances || {};
  if (c === "XMR") return b.xmrUnlocked ?? b.xmr;
  if (c === "ETH") return b.eth;
  return b.usdc;
}
// A quick shape check while typing; the wallet checks the checksum and network on Review.
function sendAddrHint(coin, to) {
  to = (to||"").trim();
  if (!to) return "";
  if (coin === "XMR") {
    if (to.startsWith("0x")) return "That looks like an Ethereum address.";
    if (to.length !== 95 && to.length !== 106) return "A Monero address is 95 characters (106 with a payment ID).";
    return "";
  }
  if (!/^0x[0-9a-fA-F]{40}$/.test(to)) return "An Ethereum address is 0x followed by 40 letters and digits.";
  return "";
}
function sendScreen() {
  const d = state.send || (state.send = {coin: "XMR", to: "", amount: "", all: false});
  if (d.result) return shell(sendDone(d), {nav:"send"});
  if (d.review) return shell(sendReview(d), {nav:"send"});
  const coins = sendCoins();
  const bal = sendBalance(d.coin);
  const hint = sendAddrHint(d.coin, d.to);
  const xmrNote = d.coin === "XMR" && (state.balances||{}).xmrLocked
    ? `<div class="a">${esc(state.balances.xmrLocked)} XMR is still locked and can't be sent yet.</div>` : "";
  return shell(`
    <h1 class="h1">Send</h1>
    <p class="lead">Move coins out of this wallet. You'll see the network fee before anything is sent.</p>
    <div class="card stack" data-testid="send-form">
      <div><label>Coin</label><div class="chips">${coins.map(c => `<button class="chip ${d.coin===c?"on":""}" data-send-coin="${c}" data-testid="send-coin-${c.toLowerCase()}">${c}</button>`).join("")}</div></div>
      <div><label>To</label>
        <input type="text" id="send-to" data-testid="send-to" value="${esc(d.to)}" autocomplete="off" spellcheck="false" class="mono"
          placeholder="${d.coin==="XMR" ? ((state.status||{}).network||"").toLowerCase().includes("stagenet") ? "Stagenet Monero address (starts with 5 or 7)" : "Monero address" : "0x…"}">
        <div class="a" id="send-hint" data-testid="send-hint" style="color:var(--warn)">${esc(hint)}</div>
        ${d.coin==="USDC" ? `<div class="a">Sent on Arbitrum. The network fee is paid in ETH.</div>` : ""}</div>
      <div><label>Amount</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="text" inputmode="decimal" id="send-amt" data-testid="send-amount" value="${esc(d.all ? "" : d.amount)}" placeholder="${d.all ? "Everything you can send" : "0.0"}" ${d.all?"disabled":""}>
          <span class="mono" style="min-width:44px">${d.coin}</span>
        </div>
        <div class="check" style="margin-top:8px"><input type="checkbox" id="send-all" data-testid="send-all" ${d.all?"checked":""}> <label for="send-all" style="margin:0">Send all</label></div>
        <div class="a" data-testid="send-avail">Available: ${esc(bal ?? (state.balances ? "—" : "…"))} ${d.coin}. Coins an open swap still needs are kept back.</div>
        ${xmrNote}</div>
      ${err()}
      <div class="actions"><button class="btn" data-act="send-review" data-testid="send-review" ${d.busy?"disabled":""}>${d.busy ? "Working out the fee…" : "Review"}</button></div>
    </div>`, {nav:"send"});
}
function sendReview(d) {
  const r = d.review;
  const left = Math.max(0, Math.round((r.expiresAt - Date.now())/1000));
  return `
    <h1 class="h1">Check and send</h1>
    <p class="lead">Nothing has been sent yet. Sends can't be undone, so check the address.</p>
    <div class="card stack" data-testid="send-review-card">
      <table class="q">
        <tr><th>Send</th><td data-testid="rv-amount"><b>${esc(r.amount)} ${esc(r.coin)}</b>${r.all ? " (everything you can send)" : ""}</td></tr>

function sendCapture() {
  const d = state.send; if (!d) return;
  const to = $("#send-to"), amt = $("#send-amt"), all = $("#send-all");
  if (to) d.to = to.value.trim();
  if (amt && !d.all) d.amount = amt.value.trim();
  if (all) d.all = all.checked;
}
let sendTick;
function sendTimer(on) {
  if (sendTick) clearInterval(sendTick); sendTick = null;
  if (!on) return;
  sendTick = setInterval(() => {
    const d = state.send;
    if (state.screen !== "send" || !d || !d.review) { sendTimer(false); return; }
    const left = Math.max(0, Math.round((d.review.expiresAt - Date.now())/1000));
    const el = $("#send-left"); if (el) el.textContent = left > 0 ? `This review is good for ${left} s.` : "This review expired. Go back and review again.";
    if (left <= 0) { const b = $("[data-testid=send-confirm]"); if (b) b.disabled = true; sendTimer(false); }
  }, 1000);
}
async function sendAct(name) {
  const d = state.send;
  if (name === "send-review") {
    sendCapture();
    if (!d.to) throw new Error("Enter the address to send to.");
    if (!d.all && !d.amount) throw new Error("Enter an amount, or tick Send all.");
    d.busy = true; render();
    try {
      const r = await api("/v1/wallet/send/prepare", {method:"POST", body: JSON.stringify({coin: d.coin, to: d.to, amount: d.amount, all: d.all})});
      r.expiresAt = Date.now() + (r.expiresIn||0)*1000;
      d.review = r; sendTimer(true);
    } finally { d.busy = false; }
  }
  if (name === "send-back") {
    if (d.review) api("/v1/wallet/send/cancel", {method:"POST", body: JSON.stringify({id: d.review.id})}).catch(()=>{});
    d.review = null; sendTimer(false);
  }
  if (name === "send-confirm") {
    d.busy = true; render();
    try {
      d.result = await api("/v1/wallet/send/confirm", {method:"POST", body: JSON.stringify({id: d.review.id})});
      d.review = null; sendTimer(false);
      refreshBalances();
    } catch(e) { d.review = null; sendTimer(false); throw e; }
    finally { d.busy = false; }
  }
  if (name === "send-new") { state.send = {coin: d.coin, to: "", amount: "", all: false}; }
}

function faucetBox() {
  if (state.faucetBusy) return `<div class="a" data-testid="faucet-busy">Asking the testnet faucet. Your computer does a few seconds of work first, instead of a captcha.</div>`;
  const f = state.faucet;
  if (!f) return `<div class="a">Free test ETH, mock USDC and stagenet XMR, sent to this wallet. One claim a day.</div>${faucetToday()}`;
  const rows = (f.payouts||[]).map(p => `<li data-testid="faucet-${esc(p.coin.toLowerCase())}">${p.tx
      ? `${esc(p.amount)} ${esc(p.coin)}: sent${p.txUrl ? ` · <a href="${esc(p.txUrl)}" target="_blank" rel="noopener">transaction</a>` : ""}`

function faucetEmpty() {
  const fs = state.faucetStatus;
  return !!fs && ["eth","usdc","xmr"].every(c => !fs[c] || !fs[c].available);
}
function faucetToday() {
  const fs = state.faucetStatus;
  if (!fs) return "";
  const names = {eth:"ETH", usdc:"USDC", xmr:"XMR"};
  const out = Object.keys(names).filter(c => fs[c] && !fs[c].available).map(c => names[c]);
  if (!out.length) return "";
  if (faucetEmpty()) return `<div class="warnbox" data-testid="faucet-empty">The faucet is empty right now. Try again later.</div>`;
  return `<div class="warnbox" data-testid="faucet-partial">The faucet is out of ${esc(out.join(" and "))} right now. A claim sends the rest; you can't claim again for a day.</div>`;
}
async function refreshFaucetStatus() {
  if (!(state.status||{}).faucet) return;
  try { state.faucetStatus = await api("/v1/faucet/status"); } catch(e) { state.faucetStatus = null; }

function fairPriceBox(q) {
  if (!q) return "";
  if (q.fairPriceError) {
    return `<div class="a" data-testid="fair-price-err">Fair price check could not run: ${esc(q.fairPriceError)}</div>`;
  }
  const f = q.fairPrice;
  if (!f) return "";
  const off = (Number(f.offBps||0)/100).toFixed(1);
  const fair = Number(f.fairXmrUsd).toFixed(2);
  const implied = Number(f.impliedXmrUsd).toFixed(2);
  const max = (Number(f.maxBps||500)/100).toFixed(0);
  if (f.warn) {
    return `<div class="warnbox" data-testid="fair-price-warn">This quote is ${off}% away from the fair price (${esc(f.source||"the XMR/USD feed")}: $${fair} / XMR). The quote implies $${implied} / XMR. Check the amounts.</div>`;
  }
  return `<div class="a" data-testid="fair-price-ok">Fair price check: within ${max}% of ${esc(f.source||"the XMR/USD feed")} ($${fair} / XMR; quote implies $${implied}).</div>`;
}

function check(ok, text, extra){ return `<div class="a">${ok?"✓":"✗"} ${esc(text)}${extra?` <span class="mono">${esc(extra)}</span>`:""}</div>`; }

// What the router itself says: mapped or not, and this computer's exit routes.
function exitRouterCard() {

  const x = state.exits || {}, now = x.now || Math.floor(Date.now()/1000);
  const leased = (x.leases||[]).filter(l => l.end>now);
  const mapped = r.mapped || [];
  const head = !r.reachable
    ? `<div class="conn error"><i></i><div>Router: ${esc(r.error||"not reachable")}</div></div>`
    : mapped.length
    ? `<div class="conn ${r.routesUp||!r.routesKnown?"connected":"error"}"><i></i><div>Mapped <small>${esc(r.label)}</small></div></div>`
    : `<div class="conn"><i></i><div>Unmapped <small>${esc(r.label)} · traffic goes out your normal connection</small></div></div>`;
  const routes = !r.reachable || !mapped.length ? ""
    : !r.routesKnown ? `<div class="a">Exit routes: this router build doesn't report them</div>`
    : `<div class="a" data-testid="router-routes">Exit routes: ${r.routesUp ? "✓ up" : "✗ down"}${!r.routesUp && r.routesReason ? ` <span class="mono">${esc(r.routesReason)}</span>` : ""}</div>`;

      <span class="a">${m.sessionLive?"session up":"no session yet"}${m.ranges&&m.ranges.length?" · "+esc(m.ranges.join(", ")):""}</span>
      <button class="btn ghost" data-exit-unmap="${esc(m.address)}" data-testid="router-unmap">Unmap</button></div>`).join("");
  const mapBtns = !mapped.length && r.reachable && leased.length && !x.connected
    ? `<div class="actions">${[...new Set(leased.map(l=>l.listingId))].map(id => `<button class="btn" data-exit-connect="${id}" data-testid="router-map">Map exit #${esc(id)} (full tunnel)</button>`).join("")}</div>` : "";
  const byAddr = !mapped.length && r.reachable && !x.connected
    ? `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><input id="map-addr" data-testid="map-addr" placeholder="exit address….sesh" style="min-width:320px" value="${esc(state.mapAddr||"")}">
        <button class="btn ghost" data-act="exit-map-addr" data-testid="map-addr-go">Map</button></div>

  return `<div class="card stack" data-testid="exit-router" data-mapped="${mapped.length?"yes":"no"}">${head}${routes}${rows}${mapBtns}${byAddr}${self}</div>`;
}

async function loadExits(){ state.exits = await api("/v1/exits"); await loadExitRouter(); }

async function exitBuy(id) {

const screens = {
  welcome, unlock, "create-show": createShow, confirm: confirmWords,
  password: () => setPassword("create"), restore: () => setPassword("restore"),

function render() {
  const el = $("#app");
  if (state.screen === "send") sendCapture(); // keep what's typed across refreshes
  const fn = screens[state.screen] || welcome;
  el.innerHTML = fn();
  const tl = $("#techlog");
  if (tl) tl.addEventListener("toggle", () => { state.techLogOpen = tl.open; });
  const wrote = $("#wrote");
  if (wrote) wrote.addEventListener("change", () => { const c=$("#cont"); if(c) c.disabled = !wrote.checked; });
  el.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go, b.dataset.id)));
  el.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => act(b.dataset.act)));
  el.querySelectorAll("[data-tag]").forEach(b => b.addEventListener("click", async () => {
    state.searchQ = {...(state.searchQ||{}), tag: b.dataset.tag}; state.err = "";
    try { await runSearch(); } catch(e) { state.err = e.message; } render(); }));
  const sqi = $("#sq");
  if (sqi) sqi.addEventListener("keydown", ev => { if (ev.key === "Enter") act("do-search"); });

    sendCapture(); state.send.coin = b.dataset.sendCoin; state.err = ""; render(); }));
  const sto = $("#send-to");
  if (sto) sto.addEventListener("input", () => { const h = $("#send-hint"); if (h) h.textContent = sendAddrHint(state.send.coin, sto.value); });
  const sall = $("#send-all");
  if (sall) sall.addEventListener("change", () => { sendCapture(); render(); });
  el.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => copy(b.dataset.copy)));

  el.querySelectorAll("[data-exit-connect]").forEach(b => b.addEventListener("click", () => exitConnect(Number(b.dataset.exitConnect))));

async function go(name, id) {
  state.err = "";
  try {
    if (name === "create") {
      const j = await api("/v1/onboard/start", {method:"POST", body:"{}"});
      state.words = j.words; state.checks = j.checks; state.screen = "create-show";
    } else if (name === "progress") {
      if (id) state.swapId = id;
      await refreshSwap();
      state.screen = "progress";
      startPoll();
    } else if (name === "home") {
      state.screen = "home"; render();
      await Promise.all([refreshBalances(), refreshFaucetStatus()]);
    } else if (name === "history") {
      const j = await api("/v1/swaps");
      state.swaps = j.swaps||[];
      state.screen = "history";
    } else if (name === "search") {
      state.screen = "search";
      await runSearch();
    } else if (name === "exits") {
      state.screen = "exits";
      await loadExits();
      startExitPoll();
    } else if (name === "send") {
      if (state.send && (state.send.result)) state.send = {coin: state.send.coin, to: "", amount: "", all: false};
      state.screen = "send"; render();
      await refreshBalances();
    } else if (name === "settings") {
      state.settings = await api("/v1/settings");
      state.screen = "settings";
    } else if (name === "create-show") {
      state.screen = "create-show";
    } else {
      state.screen = name;
      if (name === "swap") loadSwapAssets();
    }
  } catch(e) { state.err = e.message; }
  render();
}

async function act(name) {
  state.err = "";
  try {
    if (name === "unlock") {
      const pw = $("#pw").value;
      await api("/v1/wallet/unlock", {method:"POST", body: JSON.stringify({password: pw})});
      await boot();
      return;
    }
    if (name === "lock") {
      await api("/v1/wallet/lock", {method:"POST", body:"{}"});
      stopPoll(); state.send = null; sendTimer(false);
      await boot();
      return;
    }
    if (name === "to-password") {
      const answers = {};
      document.querySelectorAll("[data-word]").forEach(i => answers[i.dataset.word] = i.value.trim().toLowerCase());
      state.answers = answers;
      // Quick local check against displayed words if we still have them
      const words = state.words || [];
      for (const [n, v] of Object.entries(answers)) {
        const want = words[Number(n)-1];
        if (want && v !== want) { state.err = "Word "+n+" is not right. Look at the backup again."; render(); return; }
      }
      state.screen = "password";
    }
    if (name === "do-create") {
      const pw1 = $("#pw1").value, pw2 = $("#pw2").value;
      if (pw1 !== pw2) { state.err = "The two passwords do not match."; render(); return; }
      state.saving = true; render();
      try {
        await api("/v1/onboard/confirm", {method:"POST", body: JSON.stringify({password: pw1, words: state.answers})});
        await boot();
      } finally { state.saving = false; }
      return;
    }
    if (name === "do-restore") {
      const pw1 = $("#pw1").value, pw2 = $("#pw2").value, mn = $("#mn").value;
      if (pw1 !== pw2) { state.err = "The two passwords do not match."; render(); return; }
      state.saving = true; render();
      try {
        await api("/v1/wallet/restore", {method:"POST", body: JSON.stringify({password: pw1, mnemonic: mn})});
        await boot();
      } finally { state.saving = false; }
      return;
    }
    if (name === "get-quote") {
      const amt = $("#eth-amt").value;
      const asset = ($("#asset") && $("#asset").value) || "eth";
      state.draft = {eth: amt, asset};
      const q = asset === "usdc" ? "usdc=" : "eth=";
      state.quote = null; state.quoteFail = null;
      try { state.quote = await api("/v1/quote?"+q+encodeURIComponent(amt)); }
      catch(e) { if (e.body && e.body.quotes) state.quoteFail = e.body; throw e; }
    }
    if (name === "do-search") {
      state.searchQ = {...(state.searchQ||{}), q: $("#sq").value};
      await runSearch();
    }
    if (name === "confirm-swap") { state.screen = "confirm-swap"; }
    if (name === "start-swap") {
      const q = state.quote;
      const body = {value: q.value, minXmr: q.xmrPico, asset: q.asset, listingId: q.listingId||0};
      const j = await api("/v1/swaps", {method:"POST", body: JSON.stringify(body)});
      state.swap = j; state.swapId = j.id; state.screen = "progress";
      startPoll();
    }
    if (name === "satchel-approve") {
      const p = (state.status && state.status.pending) || {};
      const j = await api("/v1/satchel/approve", {method:"POST", body: JSON.stringify({id: p.id})});
      state.swap = j; state.swapId = j.id; state.screen = "progress";
      startPoll();
    }
    if (name === "satchel-reject") {
      await api("/v1/satchel/reject", {method:"POST", body: JSON.stringify({})});
      state.status = await api("/v1/status");
      state.screen = "home";
    }
    if (name === "save-settings") {
      const tr = document.querySelector('input[name="transport"]:checked');
      await api("/v1/settings", {method:"PUT", body: JSON.stringify({
        makerUrl: $("#maker").value, makerSeshUrl: $("#maker-sesh").value, transport: tr ? tr.value : "",
        ...($("#exit-rpc") ? {exitRouterRpc: $("#exit-rpc").value.trim()} : {})})});
      state.settings = await api("/v1/settings");
      state.status = await api("/v1/status");
    }
    if (name === "exit-topup") {
      const c = (state.exits||{}).connected || {};
      state.exitConfirm = {kind:"topup", listingId:c.listingId, hours:1}; render();
      try { const q = await api("/v1/exits/quote", {method:"POST", body: JSON.stringify({hours:1})}); state.exitConfirm = {...state.exitConfirm, price:q.price, asset:q.asset, newEnd:q.newEnd}; }
      catch(e) { state.exitConfirm = null; throw e; }
    }
    if (name === "exit-confirm-pay") { await exitPay(); return; }
    if (name === "exit-confirm-cancel") { state.exitConfirm = null; }
    if (name === "exit-map-addr") {
      const a = ($("#map-addr")||{}).value||""; state.mapAddr = a.trim();
      state.exitConnecting = true; state.exitBusy = "Mapping the exit… (up to 90 seconds. If it doesn't come up, it's unmapped and your normal connection stays.)"; render();
      try { await api("/v1/exits/map", {method:"POST", body: JSON.stringify({address:state.mapAddr})}); await loadExits(); }
      catch(e) { try { await loadExits(); } catch(_) {} throw e; }
      finally { state.exitConnecting = false; state.exitBusy = ""; }
    }
    if (name === "exit-disconnect") {
      await api("/v1/exits/disconnect", {method:"POST", body:"{}"});
      await loadExits();
    }
    if (name === "faucet-claim") {
      state.faucet = null; state.faucetBusy = true; render();
      try {
        state.faucet = await api("/v1/faucet/claim", {method:"POST", body:"{}"});
        try { state.balances = await api("/v1/balances"); } catch(e) {}
        await refreshFaucetStatus();
      } catch(e) { state.faucet = {ok:false, message: e.message}; }
      finally { state.faucetBusy = false; }
    }
    if (name.startsWith("send-")) await sendAct(name);
    if (name === "show-backup") {
      const j = await api("/v1/wallet/backup", {method:"POST", body: JSON.stringify({password: $("#pw-bak").value})});
      state.backupWords = j.words;
    }
  } catch(e) { state.err = e.message; }
  render();
}

let pollTimer;
function startPoll(){ stopPoll(); pollTimer = setInterval(refreshSwap, 4000); }
function stopPoll(){ if (pollTimer) clearInterval(pollTimer); pollTimer = null; }

async function refreshSwap() {
  if (!state.swapId) return;
  try {
    state.swap = await api("/v1/swaps/"+state.swapId);
    state.status = await api("/v1/status");
    if (state.screen === "progress") render();
  } catch(e) {}
}
async function refreshBalances() {
  try { state.balances = await api("/v1/balances"); } catch(e) { state.balances = {ethError: e.message}; }
}

// Keep the connection line fresh without re-rendering the page.
setInterval(async () => {
  if (!state.status || state.status.state !== "unlocked") return;
  try {
    const st = await api("/v1/status");
    state.status.connection = st.connection;
    const el = document.getElementById("conn");
    if (el) el.innerHTML = connLine(st);
  } catch(e) {}
}, 1500);

// Balances refresh on their own while the Balances screen is open.
setInterval(async () => {
  if (state.screen !== "home" || !state.status || state.status.state !== "unlocked" || state.faucetBusy) return;
  await refreshBalances();
  if (state.screen === "home") render();
}, 15000);

async function boot() {
  state.err = "";
  state.status = await api("/v1/status");
  const st = state.status.state;
  if (st === "new") { state.screen = "welcome"; }
  else if (st === "locked") { state.screen = "unlock"; }
  else {
    if (state.status.openId) { state.swapId = state.status.openId; state.screen = "progress"; await refreshSwap(); startPoll(); }
    else if (state.status.pending) { state.screen = "confirm-satchel"; }
    else state.screen = "home";
    render(); // show the wallet right away; balances fill in when they arrive
    await Promise.all([refreshBalances(), refreshFaucetStatus()]);
  }
  render();
}
boot().catch(e => { state.err = e.message; state.screen = "welcome"; render(); });
</script>
</body>
</html>
